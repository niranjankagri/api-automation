# Log4j2 configuration: send every log message to the console and to applog.txt

# Console output
appender.console.type=Console
appender.console.name=Console
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%-7p %d [%t] %c - %m%n

# File output: applog.txt in the project root (appended to on each run)
appender.file.type=File
appender.file.name=File
appender.file.fileName=applog.txt
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=%-7p %d [%t] %c - %m%n

# Log INFO and above to both outputs
rootLogger.level=INFO
rootLogger.appenderRef.console.ref=Console
rootLogger.appenderRef.file.ref=File
