# CircleCI pipeline: builds the project and runs the TestNG suite on every push.
# Docs: https://circleci.com/docs/language-java-maven/
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    environment:
      # Customize the JVM maximum heap limit
      MAVEN_OPTS: -Xmx3200m

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      # Run the tests
      - run: mvn clean test

      # Show results in the CircleCI "Tests" tab, even when tests fail
      - store_test_results:
          path: target/surefire-reports

      # Keep the HTML report and log as downloadable build artifacts
      - store_artifacts:
          path: target/surefire-reports/api-test-report.html
          destination: api-test-report.html
      - store_artifacts:
          path: applog.txt

workflows:
  build:
    jobs:
      - build
